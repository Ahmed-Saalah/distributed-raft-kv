services:
  node0:
    build: .
    container_name: raft-node-0
    command: ["-id", "0", "-port", "5000", "-peers", "node0:5000,node1:5000,node2:5000"]
    ports:
      - "5000:5000"
    volumes:
      - raft_data_0:/app/data

  node1:
    build: .
    container_name: raft-node-1
    command: ["-id", "1", "-port", "5000", "-peers", "node0:5000,node1:5000,node2:5000"]
    ports:
      - "5001:5000"
    volumes:
      - raft_data_1:/app/data

  node2:
    build: .
    container_name: raft-node-2
    command: ["-id", "2", "-port", "5000", "-peers", "node0:5000,node1:5000,node2:5000"]
    ports:
      - "5002:5000"
    volumes:
      - raft_data_2:/app/data

volumes:
  raft_data_0:
  raft_data_1:
  raft_data_2: