syntax = "proto3";

package raft;

option go_package = "github.com/Ahmed-Saalah/distributed-raft-kv/proto";

service Raft {
  rpc RequestVote(RequestVoteArgs) returns (RequestVoteReply) {}
  rpc AppendEntries(AppendEntriesArgs) returns (AppendEntriesReply) {}
  rpc InstallSnapshot(InstallSnapshotArgs) returns (InstallSnapshotReply) {}
}

// ---------------------------------------------------------
// RequestVote RPC
// ---------------------------------------------------------
message RequestVoteArgs {
  int32 term = 1;
  int32 candidateId = 2;
  int32 lastLogIndex = 3;
  int32 lastLogTerm = 4;
}

message RequestVoteReply {
  int32 term = 1;
  bool voteGranted = 2;
}

// ---------------------------------------------------------
// AppendEntries RPC
// ---------------------------------------------------------
message LogEntry {
  // Removed the explicit index to match your Go struct
  int32 term = 1;
  bytes command = 2; 
}

message AppendEntriesArgs {
  int32 term = 1;
  int32 leaderId = 2;
  int32 prevLogIndex = 3;
  int32 prevLogTerm = 4;
  repeated LogEntry entries = 5;
  int32 leaderCommit = 6;
}

message AppendEntriesReply {
  int32 term = 1;
  bool success = 2;
  
  // Fast-backup optimization fields mapped exactly to your code
  int32 xTerm = 3;
  int32 xIndex = 4;
  int32 xLen = 5;
}

// ---------------------------------------------------------
// InstallSnapshot RPC
// ---------------------------------------------------------
message InstallSnapshotArgs {
  int32 term = 1;
  int32 leaderId = 2;
  int32 lastIncludedIndex = 3;
  int32 lastIncludedTerm = 4;
  bytes data = 5; 
}

message InstallSnapshotReply {
  int32 term = 1;
}